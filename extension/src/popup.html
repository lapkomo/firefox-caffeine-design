<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Firefox Caffeine</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font-family: sans-serif;
        background: #111827;
        color: #f3f4f6;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        background: #3b82f6;
        color: white;
        cursor: pointer;
      }
      #status {
        margin-top: 12px;
        font-size: 12px;
        color: #d1d5db;
      }
    </style>
  </head>
  <body>
    <h1>Firefox Caffeine</h1>
    <label>
      <input id="enabled" type="checkbox" />
      <span>スリープ抑止を有効化</span>
    </label>
    <button id="setup-button" type="button">セットアップ</button>
    <div id="status">未設定</div>
    <script src="popup.js"></script>
  </body>
</html>
